40 687 V 780" class="edge"/><path d="M 710 687 V 720 H 15 V 1350 H 40" class="edge"/><path d="M 1700 687 V 740 H 1795 V 1350 H 1760" class="edge"/><text x="2130" y="399" class="stereo" xml:space="preserve" >customer</text><text x="2130" y="858" class="stereo" xml:space="preserve" >status</text><text x="1850" y="1185" class="stereo" xml:space="preserve" >+ public</text><text x="1850" y="1225" class="stereo" xml:space="preserve" >- private</text><text x="1850" y="1265" class="stereo" xml:space="preserve" >~ package-private</text><path d="M 1850 1325 H 1920" class="edge"/><text x="1940" y="1334" class="stereo" xml:space="preserve" >association</text><path d="M 1850 1385 H 1920" class="edge dep"/><text x="1940" y="1394" class="stereo" xml:space="preserve" >dependency</text><text x="40" y="1550" class="stereo">Main methods are static. Record fields are final; record constructors/accessors and the internal Payment helper are omitted.</text><text x="40" y="1590" class="stereo">Selected dependencies shown. Services have no reference to OrderFacade. Plain arrows do not imply composition or ownership.</text></svg>