<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1610" viewBox="0 0 2400 1610">
<title>Online Order Management — UML Class Diagram</title>
<desc>Main depends on OrderFacade. The facade holds directed associations to four independent services and orders, and depends on Customer. Order references Customer and Order.Status. No subsystem refers back to the facade.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#334155" stroke-width="2.5"/></marker></defs>
<rect width="2400" height="1610" fill="white"/>
