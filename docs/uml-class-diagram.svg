<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1860" viewBox="0 0 1500 1860">
<title>UML class diagram</title>
<desc>Eight classes with abbreviated field and method names. Constructors, method parameters and return types, generated record accessors, and nested helper types are omitted. Main depends on OrderFacade. OrderFacade references four services and Order, and depends on Customer. Order references Customer.</desc>
